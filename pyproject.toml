[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mall-search-api"
version = "0.1.0"
description = "Mall Search API service"
authors = [{name = "Mall Search"}]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "Flask>=2.0",
    "elasticsearch>=7.0.0,<8.0.0",
    "rapidfuzz>=3.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
